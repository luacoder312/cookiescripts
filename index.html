<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cookie Hub 🍪</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: #fff;
}
.container {
  width: 420px;
  margin: 40px auto;
  background: #0f0f0f;
  border-radius: 14px;
  box-shadow: 0 0 30px rgba(255,165,0,0.2);
  padding: 20px;
}
.header {
  text-align: center;
}
.header h1 {
  margin: 0;
  color: orange;
}
.stats {
  text-align: center;
  margin: 10px 0;
  color: #aaa;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  background: #1b1b1b;
  border-radius: 8px;
  cursor: pointer;
}
.tab.active {
  background: orange;
  color: #000;
}
.script-box {
  margin-top: 15px;
  background: #111;
  border-radius: 10px;
  padding: 12px;
  font-size: 12px;
  height: 160px;
  overflow: auto;
  white-space: pre-wrap;
}
.copy-btn {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: orange;
  font-weight: bold;
  cursor: pointer;
}
.popup {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: orange;
  color: #000;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: bold;
}
.footer {
  text-align: center;
  margin-top: 10px;
  font-size: 11px;
  color: #666;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🍪 Cookie Hub</h1>
    <p>All-in-One Script Hub</p>
  </div>

  <div class="stats">👥 Active Users: <b>189</b></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Auto Farm</div>
    <div class="tab" onclick="switchTab(1)">Dupe</div>
    <div class="tab" onclick="switchTab(2)">ESP</div>
  </div>

  <div class="script-box" id="scriptBox"></div>

  <button class="copy-btn" onclick="copyScript()">📋 Copy Script</button>

  <div class="footer">© Cookie Hub • Showcase Scripts</div>
</div>

<div class="popup" id="popup">✅ Script Copied!</div>

<script>
const scripts = [
`-- 🍪 Cookie Hub | Auto Farm (Demo)
-- Safe showcase script

print("Cookie Hub Auto Farm Loaded")

for i = 1,5 do
  print("Farming coins... 🍪", i)
  task.wait(1)
end

print("Auto Farm Finished!")`,

`-- 🍪 Cookie Hub | Dupe (Demo)
-- Visual / fake dupe simulation

print("Cookie Hub Dupe Loaded")

local items = {"Cookie","Gem","Coin"}
for _,item in pairs(items) do
  print("Duplicating:", item, "🍪")
  task.wait(0.8)
end

print("Dupe Complete!")`,

`-- 🍪 Cookie Hub | ESP (Demo)
-- Client-side visual demo

print("Cookie Hub ESP Loaded")

for _,player in pairs(game.Players:GetPlayers()) do
  print("ESP Enabled for:", player.Name, "👁️")
end

print("ESP Ready!")`
];

let currentTab = 0;
const box = document.getElementById("scriptBox");
box.textContent = scripts[0];

function switchTab(i) {
  currentTab = i;
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active", idx === i);
  });
  box.textContent = scripts[i];
}

function copyScript() {
  navigator.clipboard.writeText(scripts[currentTab]);
  const p = document.getElementById("popup");
  p.style.display = "block";
  setTimeout(()=>p.style.display="none",1500);
}
</script>

</body>
</html>
