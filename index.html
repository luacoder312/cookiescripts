<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Hub</title>

<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#3b1d6a,#0b0617 70%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  max-width:420px;
  margin:40px auto;
  background:rgba(15,10,30,.85);
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 40px rgba(140,60,255,.35);
}
h1{
  text-align:center;
  margin:0;
  font-size:30px;
  background:linear-gradient(90deg,#ffb347,#c77dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{text-align:center;opacity:.85;margin-top:5px}
.active{text-align:center;margin:10px 0 20px;font-size:14px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}

.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:linear-gradient(90deg,#8f4dff,#c77dff);
  text-align:center;
  font-weight:bold;
}

.card{
  background:#0f0b22;
  border-radius:14px;
  padding:15px;
}
.title{font-size:20px;margin-bottom:6px}
.status{font-size:13px;margin-bottom:8px}
.status span{color:#6aff8a}

pre{
  background:#05030c;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  overflow:hidden;
}

/* LOCKED SCRIPT */
.pre-locked{
  filter:blur(7px);
  pointer-events:none;
  user-select:none;
}
.lock-overlay{
  text-align:center;
  margin-top:-45px;
  font-size:22px;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button.copy{
  background:linear-gradient(90deg,#8f4dff,#c77dff);
  color:#000;
}

button.locked{
  background:linear-gradient(90deg,#ff2f2f,#ff6b6b);
  color:#fff;
  box-shadow:0 0 14px rgba(255,60,60,.7);
}

.features-box{
  margin-top:14px;
  padding:12px;
  background:#120d25;
  border-radius:12px;
  font-size:13px;
  line-height:1.6;
}

.features-title{
  font-weight:bold;
  margin-bottom:6px;
  color:#c77dff;
}

.stats{text-align:center;margin-top:8px;font-size:13px;opacity:.7}
footer{text-align:center;font-size:12px;opacity:.5;margin-top:18px}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1f123d;
  padding:10px 18px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}
</style>
</head>

<body>

<div class="container">
  <h1>🍪 Cookie Hub</h1>
  <div class="subtitle">Premium Script Hub</div>
  <div class="active pulse">👥 Active Users: <span id="users">189</span></div>

  <div class="tabs">
    <div class="tab">Script</div>
  </div>

  <div id="content"></div>
  <footer>© Cookie Hub · Educational Purpose</footer>
</div>

<div id="toast" class="toast">✅ Script Copied</div>

<script>
const scriptData={
name:"Cookie Scripts Hub Loader",
code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/cookiescriptshub/refs/heads/main/loader.lua"))()`,
copies:5421
};

const content=document.getElementById("content");
const toast=document.getElementById("toast");

function isUnlocked(){
  return localStorage.getItem("cookie_sub")==="true";
}

function render(){
  const unlocked=isUnlocked();

  content.innerHTML=`
  <div class="card">
    <div class="title">${scriptData.name} 🍪</div>
    <div class="status">🟢 <span>WORKING</span></div>

    ${
      unlocked
      ? `<pre>${scriptData.code}</pre>`
      : `<pre class="pre-locked">${scriptData.code}</pre>
         <div class="lock-overlay">🔒 Locked</div>`
    }

    <button class="${unlocked?'copy':'locked'}" onclick="handleAction()">
      ${unlocked?'📋 Copy Script':'🔒 Sub to Unlock'}
    </button>

    <div class="features-box">
      <div class="features-title">✨ Features</div>
      • Brainrot Duper<br>
      • Trade Token Duper<br>
      • Trade Freeze Script
    </div>

    <div class="stats">Copied ${scriptData.copies} times</div>
  </div>`;
}

function handleAction(){
  if(!isUnlocked()){
    localStorage.setItem("cookie_sub","true");
    window.open("https://www.youtube.com/@cookie_scripts","_blank");
    return;
  }
  navigator.clipboard.writeText(scriptData.code);
  scriptData.copies++;
  render();
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1200);
}

document.getElementById("users").innerText=186+Math.floor(Math.random()*8);
render();
</script>

</body>
</html>
