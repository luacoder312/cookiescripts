<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-user-select:none;
  user-select:none;
}

body{
  font-family:'Segoe UI',sans-serif;
  min-height:100vh;
  overflow:hidden;
  color:#fff;
  background:#0b0617;
}

/* Animated Gradient Background */
.bg{
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 30% 30%,#6a00ff33,transparent 40%),
             radial-gradient(circle at 70% 70%,#ff00c833,transparent 40%),
             radial-gradient(circle at 50% 80%,#00f0ff33,transparent 40%);
  animation:moveBg 20s linear infinite;
  z-index:-3;
}
@keyframes moveBg{
  0%{transform:translate(0,0)}
  50%{transform:translate(-10%,-10%)}
  100%{transform:translate(0,0)}
}

/* Particle Canvas */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-2;
}

/* Container */
.container{
  max-width:420px;
  margin:80px auto;
  background:rgba(20,10,40,.85);
  border-radius:20px;
  padding:20px;
  position:relative;
  backdrop-filter:blur(10px);
}

/* Neon Border */
.container::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:22px;
  background:linear-gradient(90deg,#8f4dff,#ff00ff,#00f0ff,#8f4dff);
  background-size:300% 300%;
  animation:borderMove 6s linear infinite;
  z-index:-1;
}
@keyframes borderMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

h1{
  text-align:center;
  font-size:26px;
  background:linear-gradient(90deg,#ffb347,#c77dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  opacity:.8;
  margin:5px 0 10px;
}

.active{
  text-align:center;
  margin-bottom:20px;
  font-size:14px;
}

.tab{
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#8f4dff,#c77dff);
  margin-bottom:15px;
}

.card{
  background:#120b25;
  border-radius:16px;
  padding:15px;
}

.title{font-size:18px;margin-bottom:6px}
.status{font-size:13px;margin-bottom:8px}
.status span{color:#6aff8a}

/* FIXED SCRIPT BOX */
pre{
  background:#060312;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  overflow-x:auto;
  white-space:pre-wrap;
  word-break:break-word;
  max-width:100%;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition:.3s;
  background:linear-gradient(90deg,#8f4dff,#c77dff);
  color:#000;
}

button:hover{
  box-shadow:0 0 20px #c77dff;
  transform:translateY(-2px);
}

.features-box{
  margin-top:14px;
  padding:12px;
  background:#1a1035;
  border-radius:12px;
  font-size:13px;
  line-height:1.6;
}

.features-title{
  font-weight:bold;
  margin-bottom:6px;
  color:#c77dff;
}

.stats{
  text-align:center;
  margin-top:8px;
  font-size:13px;
  opacity:.7;
}

footer{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-top:18px;
}

/* Toast Popup */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#1f123d;
  padding:12px 20px;
  border-radius:30px;
  opacity:0;
  transition:.3s;
  box-shadow:0 0 15px #8f4dff;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="bg"></div>
<canvas id="particles"></canvas>

<div class="container">
  <h1>Premium Hub</h1>
  <div class="subtitle">Animated Version</div>
  <div class="active">👥 Active Users: <span id="users">180</span></div>

  <div class="tab">Script</div>

  <div class="card">
    <div class="title">Loader Script</div>
    <div class="status">🟢 <span>WORKING</span></div>

    <pre id="script">
loadstring(game:HttpGet("https://your-link-here.com/loader.lua"))()
    </pre>

    <button onclick="copyScript()">📋 Copy Script</button>

    <div class="features-box">
      <div class="features-title">✨ Features</div>
      • Feature One<br>
      • Feature Two<br>
      • Feature Three
    </div>

    <div class="stats">Copied <span id="copies">5000</span> times</div>
  </div>

  <footer>© Premium Hub</footer>
</div>

<div id="toast" class="toast">Copied Script ✅</div>

<script>
/* PARTICLES */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2+1,
    dx:(Math.random()-.5)*0.4,
    dy:(Math.random()-.5)*0.4
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#c77dff";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.x+=p.dx;
    p.y+=p.dy;
    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;
  });
  requestAnimationFrame(animate);
}
animate();

/* COPY FUNCTION */
function copyScript(){
  const text=document.getElementById("script").innerText;
  navigator.clipboard.writeText(text);

  let copies=document.getElementById("copies");
  copies.innerText=parseInt(copies.innerText)+1;

  const toast=document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

/* USERS COUNTER */
let users=180;
setInterval(()=>{
  users+=Math.floor(Math.random()*3);
  document.getElementById("users").innerText=users;
},2000);
</script>

</body>
</html>
