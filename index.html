<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Script | Premium</title>

<style>
:root {
  --primary: #8f4dff;
  --accent: #00f0ff;
  --bg-dark: #06030e;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }

body { 
  font-family: 'Inter', sans-serif; 
  height: 100vh; 
  overflow: hidden; 
  color: #fff; 
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

/* VIDEO BACKGROUND */
.video-wrapper {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: -2;
}

.video-wrapper video {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: brightness(0.4) contrast(1.2);
}

.video-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(6,3,14,0.7) 100%);
  z-index: -1;
}

/* MAIN CONTAINER */
.container { 
  max-width: 420px; width: 92%;
  background: rgba(10, 10, 20, 0.5);
  backdrop-filter: blur(15px);
  border-radius: 25px; 
  padding: 30px; 
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  text-align: center;
}

h1 { font-size: 32px; margin-bottom: 5px; letter-spacing: -1px; }
.subtitle { opacity: 0.5; font-size: 10px; letter-spacing: 3px; margin-bottom: 15px; text-transform: uppercase; }

.status-bar {
  display: flex; justify-content: space-around;
  margin-bottom: 20px; font-size: 11px; font-weight: bold;
}

.script-area {
  position: relative;
  background: rgba(0,0,0,0.6);
  padding: 15px; border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 15px;
}

pre { 
  font-size: 11px; color: var(--accent);
  white-space: pre-wrap; word-break: break-all;
  height: 65px; overflow: hidden;
}

.locked { filter: blur(10px); }

/* BUTTONS */
button, .discord-btn {
  width: 100%; padding: 15px; border-radius: 12px;
  font-weight: 800; font-size: 14px; cursor: pointer; border: none;
  transition: 0.3s; display: flex; align-items: center; justify-content: center;
  text-decoration: none; margin-top: 10px;
}

#unlockBtn { background: #ff0000; color: #fff; } /* YouTube Red */
#copyBtn { background: var(--primary); color: #fff; }
.discord-btn { background: #5865F2; color: #fff; }

button:hover { transform: scale(1.02); opacity: 0.9; }

.features {
  text-align: left; margin-top: 20px;
  background: rgba(255,255,255,0.05);
  padding: 12px; border-radius: 12px; font-size: 12px;
}

.copy-counter { font-size: 11px; opacity: 0.4; margin-top: 15px; }

.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #fff; color: #000; padding: 10px 25px; border-radius: 50px;
  font-weight: bold; transition: 0.4s; opacity: 0;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="video-wrapper">
  <video autoplay muted loop playsinline>
    <source src="https://i.imgur.com/39wFv7W.mp4" type="video/mp4">
  </video>
</div>
<div class="video-overlay"></div>

<div class="container">
  <h1>Cookie Script</h1>
  <div class="subtitle">Premium Loader</div>

  <div class="status-bar">
    <span style="color:#6aff8a">● <span id="users">182</span> ONLINE</span>
    <span style="color:var(--accent)">V2.0 STABLE</span>
  </div>

  <div class="script-area">
    <pre id="scriptBox" class="locked">loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/cookiescriptshub/refs/heads/main/loader.lua"))()</pre>
    <div id="lockIcon" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:20px;">🔒</div>
  </div>

  <button id="unlockBtn" onclick="subscribeUnlock()">▶ SUBSCRIBE TO UNLOCK</button>
  
  <button id="copyBtn" onclick="copyScript()" style="display:none;">📋 COPY SCRIPT</button>
  
  <a href="https://discord.gg/VVzPXAG5d" target="_blank" id="discordBtn" class="discord-btn" style="display:none;">
    <span>👾</span> JOIN DISCORD
  </a>

  <div class="features">
    <b style="color:var(--primary)">FEATURES:</b><br>
    • Brainrot Duper (V2)<br>
    • Token Multiplier<br>
    • Stealth Trade Scam
  </div>

  <div class="copy-counter">
    Total Copies: <span id="copies">5402</span>
  </div>
</div>

<div id="toast" class="toast">COPIED! 🚀</div>

<script>
const scriptBox = document.getElementById("scriptBox");
const lockIcon = document.getElementById("lockIcon");
const unlockBtn = document.getElementById("unlockBtn");
const copyBtn = document.getElementById("copyBtn");
const discordBtn = document.getElementById("discordBtn");
const copySpan = document.getElementById("copies");

// Load saved copy count or start at 5402
let currentCopies = parseInt(localStorage.getItem("totalCopies")) || 5402;
copySpan.innerText = currentCopies.toLocaleString();

if(localStorage.getItem("unlocked") === "true") { unlockContent(); }

function subscribeUnlock() {
  localStorage.setItem("unlocked", "true");
  window.open("Https://youtube.com/@cookie_scripts?si=blyuvZV1utqaf4T5", "_blank");
  // The focus event below will handle the reveal when they come back
}

function unlockContent() {
  scriptBox.classList.remove("locked");
  lockIcon.style.display = "none";
  unlockBtn.style.display = "none";
  copyBtn.style.display = "flex";
  discordBtn.style.display = "flex";
}

window.addEventListener("focus", () => {
  if(localStorage.getItem("unlocked") === "true") { unlockContent(); }
});

function copyScript() {
  navigator.clipboard.writeText(scriptBox.innerText);
  
  // Update counter
  currentCopies++;
  copySpan.innerText = currentCopies.toLocaleString();
  localStorage.setItem("totalCopies", currentCopies);
  
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

// Online user simulation
let users = 182;
setInterval(() => {
  users += Math.floor(Math.random() * 3) - 1;
  document.getElementById("users").innerText = users;
}, 3000);
</script>

</body>
</html>
