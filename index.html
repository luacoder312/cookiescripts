<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Hub</title>

<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(-45deg,#1a0f2e,#2d1155,#0f061f,#3a1475);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Floating particles */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity:.08;
  animation:moveStars 60s linear infinite;
}
@keyframes moveStars{
  from{transform:translate(0,0)}
  to{transform:translate(-500px,-500px)}
}

.container{
  max-width:420px;
  margin:60px auto;
  background:rgba(20,10,40,.85);
  border-radius:20px;
  padding:20px;
  position:relative;
  box-shadow:0 0 40px rgba(140,60,255,.35);
  animation:fadeIn .8s ease;
}

/* Glowing animated border */
.container::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:22px;
  background:linear-gradient(90deg,#8f4dff,#ff4df0,#8f4dff);
  background-size:300% 300%;
  animation:borderGlow 6s linear infinite;
  z-index:-1;
}
@keyframes borderGlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

h1{
  text-align:center;
  margin:0;
  font-size:28px;
  background:linear-gradient(90deg,#ffb347,#c77dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{text-align:center;opacity:.8;margin-top:5px}
.active{text-align:center;margin:10px 0 20px;font-size:14px}

.tabs{
  margin-bottom:15px;
}
.tab{
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#8f4dff,#c77dff);
}

.card{
  background:#120b25;
  border-radius:16px;
  padding:15px;
}

.title{font-size:18px;margin-bottom:6px}
.status{font-size:13px;margin-bottom:8px}
.status span{color:#6aff8a}

pre{
  background:#060312;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  overflow:hidden;
}

.pre-locked{
  filter:blur(6px);
  pointer-events:none;
}

.lock-overlay{
  text-align:center;
  margin-top:-40px;
  font-size:22px;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.3s;
}

button.copy{
  background:linear-gradient(90deg,#8f4dff,#c77dff);
  color:#000;
}
button.copy:hover{
  box-shadow:0 0 20px rgba(199,125,255,.8);
  transform:translateY(-2px);
}

button.locked{
  background:linear-gradient(90deg,#ff2f2f,#ff6b6b);
  color:#fff;
}

/* Ripple effect */
button::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  background:rgba(255,255,255,.4);
  border-radius:50%;
  transform:translate(-50%,-50%);
  top:50%;
  left:50%;
  opacity:0;
  transition:.6s;
}
button:active::after{
  width:200%;
  height:200%;
  opacity:0;
}

.features-box{
  margin-top:14px;
  padding:12px;
  background:#1a1035;
  border-radius:12px;
  font-size:13px;
  line-height:1.6;
}

.features-title{
  font-weight:bold;
  margin-bottom:6px;
  color:#c77dff;
}

.stats{text-align:center;margin-top:8px;font-size:13px;opacity:.7}
footer{text-align:center;font-size:12px;opacity:.5;margin-top:18px}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1f123d;
  padding:10px 18px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}
</style>
</head>

<body>

<div class="container">
  <h1>Premium Hub</h1>
  <div class="subtitle">Animated Version</div>
  <div class="active">👥 Active Users: <span id="users">0</span></div>

  <div class="tabs">
    <div class="tab">Script</div>
  </div>

  <div id="content"></div>
  <footer>© Premium Hub</footer>
</div>

<div id="toast" class="toast">✅ Script Copied</div>

<script>
const scriptData={
name:"Loader Script",
code:`print("Your loader here")`,
copies:5421
};

const content=document.getElementById("content");
const toast=document.getElementById("toast");

function isUnlocked(){
  return localStorage.getItem("hub_unlock")==="true";
}

function render(){
  const unlocked=isUnlocked();

  content.innerHTML=`
  <div class="card">
    <div class="title">${scriptData.name}</div>
    <div class="status">🟢 <span>WORKING</span></div>

    ${
      unlocked
      ? `<pre>${scriptData.code}</pre>`
      : `<pre class="pre-locked">${scriptData.code}</pre>
         <div class="lock-overlay">🔒</div>`
    }

    <button class="${unlocked?'copy':'locked'}" onclick="handleAction()">
      ${unlocked?'📋 Copy Script':'🔒 Unlock'}
    </button>

    <div class="features-box">
      <div class="features-title">✨ Features</div>
      • Feature One<br>
      • Feature Two<br>
      • Feature Three
    </div>

    <div class="stats">Copied ${scriptData.copies} times</div>
  </div>`;
}

function handleAction(){
  if(!isUnlocked()){
    localStorage.setItem("hub_unlock","true");
    return render();
  }
  navigator.clipboard.writeText(scriptData.code);
  scriptData.copies++;
  render();
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1200);
}

/* Animated user counter */
let users=180;
setInterval(()=>{
  users+=Math.floor(Math.random()*3);
  document.getElementById("users").innerText=users;
},2000);

render();
</script>

</body>
</html>
